<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
   

    <title>Converso de Moeda</title>

</head>

<body>
    <img class="logo" src="/Projeto_Conversor_de_Moeda/assets/logo.gif" alt="Logo Gif">

    <main>
        <label> Converter <b>de</b>
            <select class="convert-de">
                <option value="real"> R$ Real brasileiro </option>
            
            </select>

        </label>

        <label> Converter <b>para</b>
            <select class="convercao-select">
                <option value="dolar"> US$ Dolar americano </option>
                <option value="euro"> € Euro </option>
                <option value="libra"> £ Libra </option>
                <option value="bitcoin"> ₿ Bitcoin</option>
            </select>

        </label>

        <label>
            Valor
            <input class="input-digitado" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="moeda">
                <img class="bandeira-brasil" src="/Projeto_Conversor_de_Moeda/assets/bandeira brasil.png"
                    alt="Bandeira-Brasil">
                <p class="escrita-real"> Real </p>
                <p class="valor-a-converter">  R$ 0,00  </p>

            </div>
            <img class="seta" src="/Projeto_Conversor_de_Moeda/assets/Seta.png" alt="Seta">

            <div class="moeda">
                <img class="bandeira-pais" src="/Projeto_Conversor_de_Moeda/assets/bandeira usa.png"
                    alt="Bandeira-Americana">
                <p class="escrita-name"> Dólar Americano </p>
                <p class="valor-convertido">  US$ 0.0  </p>
            </div>
        </section>
    </main>

</body>

 <script src="./script.js"></script>

</html>
